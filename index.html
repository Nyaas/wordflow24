<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhịp · Hôm nay và chuỗi task</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#EEF1F9;--card:#fff;--ink:#0F1733;--mut:#5E6A8A;--line:#DDE2F0;--soft:#F4F6FC;
  --ember:#FF5A1F;--ember2:#FF9A3C;--ok:#0FA37F;--late:#E09B00;--miss:#E5484D;--pend:#C9D0E4;
  --navy:#101A44;--navy2:#2B3BA6;
  --fd:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;--fb:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#090E22;--card:#121A38;--ink:#EBEFFF;--mut:#95A1C6;--line:#232D55;--soft:#18214A;--pend:#34406E;--navy:#0B1236;--navy2:#2A3A9C;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 24px var(--fd);letter-spacing:-.02em}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--ember),var(--ember2));display:grid;place-items:center;font-size:20px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:14px 28px;font-size:16px;background:linear-gradient(135deg,var(--ember),var(--ember2));color:#fff}
.msg{padding:12px 16px;border-radius:14px;background:var(--soft);color:var(--mut);font-size:13px}
.msg.err{background:rgba(229,72,77,.12);color:var(--miss)}
.login{text-align:center;padding:64px 24px;border-radius:28px;background:var(--card);border:1px solid var(--line)}
.login h1{font:800 clamp(32px,6vw,52px)/1.05 var(--fd);letter-spacing:-.03em;margin:0 0 12px}
.login p{max-width:440px;margin:0 auto 24px;color:var(--mut)}
.tabs{display:inline-flex;align-self:flex-start;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 22px;border-radius:999px;font-weight:600;color:var(--mut)}
.tabs button[aria-pressed=true]{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff}
main{display:flex;flex-direction:column;gap:18px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 34px;border-radius:30px;color:#fff;background:radial-gradient(120% 150% at 100% 0%,var(--navy2) 0%,var(--navy) 62%)}
.dw{margin:0;opacity:.7;font-weight:500}
.hero h1{margin:0;font:800 clamp(40px,9vw,68px)/1 var(--fd);letter-spacing:-.03em}
.sm{margin:12px 0 16px;opacity:.88}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600;font-size:13px}
.chip.fire{background:linear-gradient(135deg,var(--ember),var(--ember2))}
.chip.warn{background:rgba(229,72,77,.85)}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle:last-child{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 30px var(--fd)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
h2{margin:0 0 12px;font:700 19px var(--fd);letter-spacing:-.01em}
.h2{margin:8px 0 0}
.ev{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--soft);border-left:5px solid var(--c,#6C7BFF);margin-bottom:8px}
.ev.past{opacity:.5}
.ev.now{background:color-mix(in srgb,var(--c) 18%,var(--soft));box-shadow:0 0 0 1.5px var(--c)}
.ev time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--mut)}
.ev b{font-weight:600}.ev small,.it small{display:block;color:var(--mut);font-size:12px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.badge.soft{background:transparent;color:var(--mut);border:1px solid var(--line)}
.sub{margin:16px 0 4px;font-size:13px;font-weight:700;color:var(--mut)}
.sub:first-of-type{margin-top:0}
.sub.red{color:var(--miss)}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.sub+.it{border-top:0}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--pend);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.ck.ok{background:var(--ok);border-color:var(--ok)}.ck.bad{border-color:var(--miss)}
.it b{font-weight:600}.it.done b{text-decoration:line-through;color:var(--mut);font-weight:500}
.fl{margin-left:auto;font-weight:700;color:var(--ember);white-space:nowrap}
.empty{color:var(--mut);padding:14px 0}
.skh{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center;padding:28px 32px;border-radius:30px;color:#fff;background:linear-gradient(120deg,#FF4416,#FF8B2B)}
.num{font:800 clamp(72px,16vw,124px)/.85 var(--fd);letter-spacing:-.05em}
.skh p{margin:10px 0 0;font-weight:600}
.wk{display:flex;gap:8px}
.wk div{width:46px;text-align:center;font-size:12px;font-weight:600}
.wk i{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;margin-bottom:5px;background:rgba(255,255,255,.2);font-style:normal;font-size:20px;font-weight:700}
.wk i.ok{background:#fff;color:var(--ok)}.wk i.miss{background:rgba(110,0,0,.4)}.wk i.pend{background:transparent;border:2px dashed rgba(255,255,255,.75)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tl div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.tl b{display:block;font:800 32px/1.1 var(--fd)}.tl span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.sc header b{font-weight:700;display:block}.sc header small{color:var(--mut);font-size:12px}
.big{display:flex;align-items:baseline;gap:8px;margin:12px 0 10px}
.big .n{font:800 56px/1 var(--fd);color:var(--ember);letter-spacing:-.03em}
.sc.cold .n{color:var(--mut)}
.big span{font-weight:600}.big em{margin-left:auto;font-style:normal;color:var(--mut);font-size:13px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dt{width:14px;height:14px;border-radius:5px;background:var(--pend)}
.dt.ok{background:var(--ok)}.dt.late{background:var(--late)}.dt.miss{background:var(--miss)}.dt.pend{opacity:.45}
.td{margin:10px 0 0;font-size:13px;font-weight:600}
.td.ok{color:var(--ok)}.td.pend{color:var(--mut)}.td.miss{color:var(--miss)}.td.late{color:var(--late)}
.why{margin:8px 0 0;font-size:12px;color:var(--miss)}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;font-size:12px;width:100%}td,th{padding:5px 8px;border-top:1px solid var(--line);text-align:left}
input#tf{width:100%;padding:9px 12px;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit}
footer{color:var(--mut);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;padding:0;text-decoration:underline;color:var(--mut)}
@media(max-width:760px){.cols{grid-template-columns:1fr}.hero{padding:24px}.ring{width:104px;height:104px}.ring svg{width:104px;height:104px}.tl{grid-template-columns:1fr}.skh{padding:24px}}
@media(prefers-reduced-motion:reduce){.ring circle:last-child{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">🔥</span>Nhịp</div>
    <button class="btn ghost" id="btn-sync" hidden>Làm mới</button>
  </header>
  <div class="msg" id="msg" hidden></div>
  <section class="login" id="login">
    <h1>Giữ nhịp mỗi ngày</h1>
    <p id="login-t">Đăng nhập Google để xem việc cần làm hôm nay và chuỗi hoàn thành của từng task. Trang chỉ xin quyền đọc Lịch và Tasks, không sửa hay xóa gì.</p>
    <button class="btn big" id="btn-login">Đăng nhập Google</button>
  </section>
  <nav class="tabs" id="tabs" hidden aria-label="Chọn tab">
    <button type="button" id="t-today" aria-pressed="true">Hôm nay</button>
    <button type="button" id="t-streak" aria-pressed="false">Chuỗi task</button>
  </nav>
  <main id="pg-today" hidden></main>
  <main id="pg-streak" hidden></main>
  <footer><span id="stamp"></span><button class="lnk" id="btn-cid" type="button">Đổi Client ID</button></footer>
</div>
<script>
(function(){
var DAY=864e5,CID0='425760458480-j4aki3l5p9sad12o6mhob45jsu4766eg.apps.googleusercontent.com';
var SCOPE='https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks.readonly',GL='gtask-streak-v1';
var tok=null,tc=null,tmr=null,pol=null,last=0,TK=[],EV=[],RT=null,curTab='today',first=true,G={seen:{},broke:{},ok:false};
try{var g0=JSON.parse(localStorage.getItem(GL));if(g0&&g0.seen)G=g0}catch(e){}
function $(i){return document.getElementById(i)}
function gsave(){try{localStorage.setItem(GL,JSON.stringify(G))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hm(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())}
function dm(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function dp(t){var m=(t.due||'').match(/^(\d+)-(\d+)-(\d+)/);return m?[new Date(+m[1],m[2]-1,+m[3]).getTime(),new Date(+m[1],m[2]-1,+m[3]+1).getTime()]:null}
function tkey(t){return t.list+'|'+t.title.toLowerCase()}
function cid(){try{return localStorage.getItem('gcid')||CID0}catch(e){return CID0}}
function msg(t,err){var m=$('msg');m.hidden=!t;m.textContent=t||'';m.className='msg'+(err?' err':'')}

/* ---------- đăng nhập Google ---------- */
function showApp(on){
  $('login').hidden=on;$('tabs').hidden=!on;$('btn-sync').hidden=!on;
  if(!on){$('pg-today').hidden=true;$('pg-streak').hidden=true}else tab(curTab);
}
function gInit(){
  if(!window.google||!google.accounts){return setTimeout(gInit,300)}
  tc=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:SCOPE,callback:onTok,
    error_callback:function(e){showApp(false);$('login-t').textContent='Chưa đăng nhập được ('+((e&&e.type)||'lỗi')+'). Bấm nút bên dưới để thử lại.'}});
  if(G.ok){$('login-t').textContent='Đang đăng nhập bằng tài khoản đã cấp quyền…';tc.requestAccessToken({prompt:''})}
}
function onTok(r){
  if(r.error){showApp(false);msg('Đăng nhập lỗi: '+r.error+(r.error_description?' - '+r.error_description:''),1);return}
  tok=r.access_token;G.ok=true;gsave();showApp(true);
  clearTimeout(tmr);tmr=setTimeout(function(){tc.requestAccessToken({prompt:''})},Math.max(60,(r.expires_in||3600)-120)*1000);
  syncAll();
}
async function gapi(url){
  var r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
  if(r.status===401){tok=null;showApp(false);throw new Error('Phiên đăng nhập hết hạn, bấm Đăng nhập Google lại.')}
  if(!r.ok){var m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Google trả lỗi '+r.status+(m?': '+m:''))}
  return r.json();
}
async function fetchToday(){
  var B='https://www.googleapis.com/calendar/v3/',cals=(await gapi(B+'users/me/calendarList?maxResults=250')).items||[],out=[];
  var n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),t1=new Date(t0.getTime()+DAY);
  var q='&singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(t0.toISOString())+'&timeMax='+encodeURIComponent(t1.toISOString());
  for(var i=0;i<cals.length;i++){
    var c=cals[i],cn=c.summaryOverride||c.summary||c.id;
    if(!c.selected||String(c.id).indexOf('#contacts')>=0)continue;
    var d=await gapi(B+'calendars/'+encodeURIComponent(c.id)+'/events?'+q);
    (d.items||[]).forEach(function(v){
      if(v.status==='cancelled'||!v.start||!v.end)return;
      var me=(v.attendees||[]).filter(function(a){return a.self})[0];if(me&&me.responseStatus==='declined')return;
      var ad=!!v.start.date;
      out.push({s:ad?new Date(v.start.date+'T00:00:00').getTime():Date.parse(v.start.dateTime),e:ad?new Date(v.end.date+'T00:00:00').getTime():Date.parse(v.end.dateTime),title:v.summary||'(không tiêu đề)',ad:ad,cal:cn,color:c.backgroundColor});
    });
  }
  return out;
}
async function fetchTasks(){
  var B='https://tasks.googleapis.com/tasks/v1/',ls=(await gapi(B+'users/@me/lists?maxResults=100')).items||[],all=[];
  for(var i=0;i<ls.length;i++){
    var pt='';
    do{
      var d=await gapi(B+'lists/'+ls[i].id+'/tasks?showCompleted=true&showHidden=true&showAssigned=true&maxResults=100'+(pt?'&pageToken='+pt:''));
      (d.items||[]).forEach(function(t){all.push({id:t.id,list:ls[i].title,title:(t.title||'').trim(),due:t.due||'',upd:t.updated||'',done:t.status==='completed'&&t.completed?Date.parse(t.completed):null})});
      pt=d.nextPageToken;
    }while(pt);
  }
  return all;
}
async function syncAll(){
  msg('Đang cập nhật từ Google…');var errs=[];
  try{EV=await fetchToday()}catch(e){errs.push('Lịch: '+e.message)}
  try{TK=await fetchTasks();buildTasks()}catch(e){errs.push('Tasks: '+e.message)}
  renderToday();renderStreak();last=Date.now();
  msg(errs.join(' | '),errs.length);
  $('stamp').textContent='Cập nhật lúc '+hm(last)+'. Giữ tab mở để tự làm mới mỗi 5 phút.';
  clearTimeout(pol);pol=setTimeout(function(){if(tok)syncAll()},3e5);
}

/* ---------- luật chuỗi ----------
   Xong trong ngày hạn thì +1 ngày. Bỏ lỡ, xong muộn, dời lịch hoặc xóa task = mất chuỗi.
   Nhiệm vụ lặp nhiều lần/ngày: mọi lần trong ngày đều phải đúng hạn. Việc làm một lần không tính. */
function buildTasks(){
  var now=Date.now(),n=new Date(now),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),cur={},g={},st={ok:0,late:0,miss:0,pend:0},days={};
  TK.forEach(function(t){cur[t.id]=t});
  Object.keys(G.seen).forEach(function(id){
    var p=G.seen[id],c=cur[id];
    if(!c){G.broke[p.k]={at:t0,why:'đã xóa một nhiệm vụ trong chuỗi'};delete G.seen[id]}
    else if(!c.done&&c.due!==p.due)G.broke[p.k]={at:t0,why:'đã dời lịch một nhiệm vụ'};
  });
  TK.forEach(function(t){if(t.done)delete G.seen[t.id];else G.seen[t.id]={k:tkey(t),due:t.due}});
  TK.forEach(function(t){
    var p=dp(t);if(!t.title||!p)return;
    var s=t.done?(t.done<=p[1]?'ok':'late'):(p[1]<=now?'miss':'pend');
    st[s]++;var k=tkey(t);(g[k]=g[k]||{name:t.title,list:t.list,o:[]}).o.push({ds:p[0],s:s});
  });
  var res=[],by={};
  Object.keys(g).forEach(function(k){
    var x=g[k];if(x.o.length<2)return;
    var bk=G.broke[k],b=bk?bk.at:0,run=0,best=0,sd={},dd=[];
    x.o.filter(function(q){return q.ds>=b}).forEach(function(q){
      var u=sd[q.ds]||(sd[q.ds]={ok:0,late:0,miss:0,pend:0});u[q.s]++;
      var d=days[q.ds]||(days[q.ds]={ok:0,bad:0,pend:0});
      if(q.s==='ok')d.ok++;else if(q.s==='pend')d.pend++;else d.bad++;
    });
    Object.keys(sd).sort(function(p,q){return p-q}).forEach(function(t){
      var u=sd[t],s=u.miss?'miss':u.late?'late':u.pend?'pend':'ok';
      if(s==='ok'){run++;best=Math.max(best,run)}else if(s!=='pend')run=0;
      dd.push(s);
    });
    var u0=sd[t0],td=u0?(u0.miss?'miss':u0.late?'late':u0.pend?'pend':'ok'):'';
    res.push({k:k,name:x.name,list:x.list,run:run,best:best,dots:dd.slice(-14),n:x.o.length,bk:bk,td:td});
    by[k]={run:run,td:td};
  });
  var dr=0,db=0;
  Object.keys(days).sort(function(p,q){return p-q}).forEach(function(t){var d=days[t];if(d.bad)dr=0;else if(!d.pend&&d.ok){dr++;db=Math.max(db,dr)}});
  var wk=[];
  for(var i=6;i>=0;i--){var t=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i).getTime(),d=days[t];wk.push({t:t,s:d?(d.bad?'miss':d.pend?'pend':'ok'):'none'})}
  RT={res:res.sort(function(p,q){return q.run-p.run}),by:by,dr:dr,db:db,st:st,wk:wk};
  gsave();
}

/* ---------- tab Hôm nay ---------- */
function trow(t,kind){
  var r=RT&&RT.by[tkey(t)],fl=r&&r.run>0?'<span class="fl" title="Chuỗi hiện tại">🔥 '+r.run+'</span>':'';
  var ck=kind==='done'?'<span class="ck ok">✓</span>':'<span class="ck'+(kind==='over'?' bad':'')+'"></span>';
  var sm=esc(t.list)+(kind==='over'?' · hạn '+dm(new Date(dp(t)[0])):'');
  return '<div class="it'+(kind==='done'?' done':'')+'">'+ck+'<div><b>'+esc(t.title)+'</b><small>'+sm+'</small></div>'+fl+'</div>';
}
function renderToday(){
  var now=Date.now(),n=new Date(now),ty=ymd(n),DW=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  var tt=TK.filter(function(t){return t.title&&t.due&&t.due.slice(0,10)===ty});
  var pend=tt.filter(function(t){return!t.done}),dn=tt.filter(function(t){return t.done}),tot=tt.length,pc=tot?dn.length/tot:0;
  var over=TK.filter(function(t){var p=dp(t);return t.title&&p&&!t.done&&p[1]<=now&&p[1]>now-14*DAY}).sort(function(a,b){return b.due.localeCompare(a.due)}).slice(0,8);
  var evs=EV.slice().sort(function(a,b){return (b.ad-a.ad)||a.s-b.s}),nxt=evs.filter(function(e){return!e.ad&&e.s>now})[0];
  var C=2*Math.PI*56;
  var h='<section class="hero"><div><p class="dw">'+DW[n.getDay()]+'</p><h1>'+n.getDate()+' tháng '+(n.getMonth()+1)+'</h1><p class="sm">'
    +(tot?(dn.length===tot?'Xong hết '+tot+' task hôm nay. Giữ nhịp nhé!':'Còn '+pend.length+' task cần xong trong hôm nay.'):'Hôm nay chưa có task nào có hạn.')
    +'</p><div class="chips"><span class="chip fire">🔥 '+(RT?RT.dr:0)+' ngày liên tiếp</span><span class="chip">'+evs.length+' sự kiện</span>'+(over.length?'<span class="chip warn">'+over.length+' việc quá hạn</span>':'')+'</div></div>'
    +'<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="12"/><circle id="arc" cx="66" cy="66" r="56" fill="none" stroke="#FFB04A" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(first?C:C*(1-pc))+'"/></svg><b>'+(tot?dn.length+'/'+tot:'—')+'</b></div></section>';
  var eh=evs.length?evs.map(function(e){
    var s=e.ad?'':(e.e<=now?'past':e.s<=now?'now':''),b=s==='now'?'<span class="badge">Đang diễn ra</span>':(e===nxt?'<span class="badge soft">Sắp tới</span>':'');
    return '<div class="ev '+s+'" style="--c:'+esc(e.color||'#6C7BFF')+'"><time>'+(e.ad?'Cả ngày':hm(e.s)+'–'+hm(e.e))+'</time><div><b>'+esc(e.title)+'</b><small>'+esc(e.cal)+'</small></div>'+b+'</div>';
  }).join(''):'<div class="empty">Hôm nay không có sự kiện nào.</div>';
  var th='';
  if(pend.length)th+='<p class="sub">Cần làm</p>'+pend.map(function(t){return trow(t,'pend')}).join('');
  if(dn.length)th+='<p class="sub">Đã xong</p>'+dn.map(function(t){return trow(t,'done')}).join('');
  if(over.length)th+='<p class="sub red">Quá hạn, chưa xong</p>'+over.map(function(t){return trow(t,'over')}).join('');
  if(!th)th='<div class="empty">Không có task nào hạn hôm nay.</div>';
  $('pg-today').innerHTML=h+'<div class="cols"><section class="card"><h2>Lịch hôm nay</h2>'+eh+'</section><section class="card"><h2>Task hôm nay</h2>'+th+'</section></div>';
  if(first&&tok){first=false;setTimeout(function(){var a=$('arc');if(a)a.style.strokeDashoffset=C*(1-pc)},60)}
}

/* ---------- tab Chuỗi task ---------- */
var TXT={ok:'Hôm nay: đã xong ✓',pend:'Hôm nay: chưa xong',miss:'Hôm nay: bỏ lỡ',late:'Hôm nay: xong muộn, mất chuỗi','':'Hôm nay: không có lịch'};
function renderStreak(){
  var el=$('pg-streak');
  if(!RT){el.innerHTML='<div class="empty">Chưa có dữ liệu task.</div>';return}
  var r=RT,st=r.st,tot=st.ok+st.late+st.miss,L=['CN','T2','T3','T4','T5','T6','T7'];
  var h='<section class="skh"><div><div class="num">'+r.dr+'</div><p>ngày liên tiếp hoàn thành đúng hạn · tốt nhất '+r.db+' ngày</p></div><div class="wk">'
    +r.wk.map(function(w){return '<div><i class="'+w.s+'">'+(({ok:'✓',miss:'✕'})[w.s]||'')+'</i>'+L[new Date(w.t).getDay()]+'</div>'}).join('')+'</div></section>';
  h+='<section class="tl"><div><b>'+(tot?Math.round(st.ok/tot*100):0)+'%</b><span>đúng hạn ('+st.ok+'/'+tot+')</span></div><div><b>'+st.miss+'</b><span>bỏ lỡ: quá hạn, chưa xong</span></div><div><b>'+st.late+'</b><span>hoàn thành muộn, không tính chuỗi</span></div></section>';
  h+='<h2 class="h2">Chuỗi từng nhiệm vụ lặp lại</h2>';
  h+=r.res.length?'<div class="grid">'+r.res.map(function(x){
    return '<article class="sc'+(x.run?'':' cold')+'"><header><b>'+esc(x.name)+'</b><small>'+esc(x.list)+' · '+x.n+' lần</small></header>'
      +'<div class="big"><span class="n">'+x.run+'</span><span>ngày '+(x.run?'🔥':'🧊')+'</span><em>tốt nhất '+x.best+'</em></div>'
      +'<div class="dots">'+x.dots.map(function(s){return '<i class="dt '+s+'" title="'+({ok:'Đúng hạn',late:'Hoàn thành muộn',miss:'Bỏ lỡ',pend:'Chưa tới hạn'})[s]+'"></i>'}).join('')+'</div>'
      +'<p class="td '+(x.td||'pend')+'">'+TXT[x.td]+'</p>'
      +(x.bk?'<p class="why">Mất chuỗi ngày '+dm(new Date(x.bk.at))+': '+esc(x.bk.why)+'</p>':'')+'</article>'}).join('')+'</div>'
    :'<div class="card empty">Chưa thấy nhiệm vụ lặp lại nào (cùng tên, cùng danh sách, có ngày hạn, từ 2 lần trở lên).</div>';
  var ls={},nodue=0,was=!!el.querySelector('details[open]'),fv=(el.querySelector('#tf')||{}).value||'';
  TK.forEach(function(t){ls[t.list]=1;if(!t.due)nodue++});
  var tr=TK.slice().sort(function(a,b){return a.title.localeCompare(b.title)||(a.due||'').localeCompare(b.due||'')}).slice(0,900).map(function(t){
    return '<tr class="tr"><td>'+esc(t.title||'(trống)')+'</td><td>'+(t.due?t.due.slice(0,10):'không có hạn')+'</td><td>'+(t.done?'xong '+new Date(t.done).toLocaleString('vi-VN'):'chưa xong')+'</td><td>'+esc(t.list)+'</td></tr>'}).join('');
  h+='<details'+(was?' open':'')+'><summary>Dữ liệu đọc từ Google: '+Object.keys(ls).length+' danh sách, '+TK.length+' task ('+nodue+' không có ngày hạn)</summary><input id="tf" value="'+esc(fv)+'" placeholder="Lọc theo tên, ví dụ: đề lí"><div style="overflow-x:auto"><table><tr><th>Tên</th><th>Hạn</th><th>Trạng thái</th><th>Danh sách</th></tr>'+tr+'</table></div></details>';
  el.innerHTML=h;tfilter();
}
function tfilter(){var q=(($('tf')||{}).value||'').toLowerCase();document.querySelectorAll('#pg-streak tr.tr').forEach(function(r){r.hidden=!!q&&r.textContent.toLowerCase().indexOf(q)<0})}

/* ---------- điều khiển ---------- */
function tab(n){
  curTab=n;$('pg-today').hidden=n!=='today';$('pg-streak').hidden=n!=='streak';
  $('t-today').setAttribute('aria-pressed',n==='today');$('t-streak').setAttribute('aria-pressed',n==='streak');
}
$('t-today').addEventListener('click',function(){tab('today')});
$('t-streak').addEventListener('click',function(){tab('streak')});
$('pg-streak').addEventListener('input',function(e){if(e.target.id==='tf')tfilter()});
$('btn-login').addEventListener('click',function(){if(tc)tc.requestAccessToken({prompt:G.ok?'':'consent'});else gInit()});
$('btn-sync').addEventListener('click',function(){if(tok)syncAll();else if(tc)tc.requestAccessToken({prompt:''})});
$('btn-cid').addEventListener('click',function(){var v=prompt('Dán Client ID của bạn (dạng ...apps.googleusercontent.com):',cid());if(v&&v.trim()){try{localStorage.setItem('gcid',v.trim())}catch(e){}location.reload()}});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(!tok&&G.ok&&tc)tc.requestAccessToken({prompt:''});
  else if(tok&&Date.now()-last>12e4)syncAll();
});
setInterval(function(){if(tok&&!first)renderToday()},6e4);
gInit();
})();
</script>
</body>
</html>
