<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chuỗi Google Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f6f7f9;--ink:#14212b;--mut:#64727e;--card:#fff;--line:#dfe4e9;--ok:#1f8f5f;--late:#e0a100;--miss:#d64545;--pend:#b8c1c9}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e8edf1;--mut:#8b9aa6;--card:#18222a;--line:#27333d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.st{color:var(--mut);font-size:13px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.hero b{font-size:56px;font-weight:800;line-height:1}
.hero span{color:var(--mut)}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.top strong{font-weight:600}
.top em{font-style:normal;font-weight:800;white-space:nowrap}
.meta{color:var(--mut);font-size:12px;margin:2px 0 8px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dt{width:12px;height:12px;border-radius:3px;background:var(--pend)}
.dt.ok{background:var(--ok)}.dt.late{background:var(--late)}.dt.miss{background:var(--miss)}.dt.pend{opacity:.4}
.lost{color:var(--miss);font-size:13px}
h2{font-size:16px;margin:24px 0 8px}
.err{color:var(--miss)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Chuỗi Google Tasks</h1>
  <p class="sub">Đọc thẳng task từ tài khoản Google của bạn và tính chuỗi theo giờ hoàn thành thật.</p>
  <div class="bar">
    <button class="p" id="login">Đăng nhập Google</button>
    <button id="refresh" hidden>Làm mới</button>
    <span class="st" id="st" aria-live="polite"></span>
  </div>
  <div id="out"></div>
</div>
<script>
// ===== CẤU HÌNH: dán Client ID tạo trong Google Cloud Console =====
var CLIENT_ID='DÁN_CLIENT_ID_CỦA_BẠN.apps.googleusercontent.com';
// ===================================================================
var SCOPE='https://www.googleapis.com/auth/tasks.readonly',LS='gtasks-streak-v1';
var tok=null,tc=null,timer=null,S={seen:{},broke:{},consented:false};
try{var s0=JSON.parse(localStorage.getItem(LS));if(s0)S=s0}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sod(t){var d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function say(t,e){$('st').textContent=t;$('st').className='st'+(e?' err':'')}

function init(){
  if(!window.google||!google.accounts){return setTimeout(init,300)}
  if(CLIENT_ID.indexOf('DÁN_')===0){say('Chưa có Client ID. Mở file này và dán Client ID vào đầu phần script.',1);return}
  tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:onToken,error_callback:function(){say('Chưa đăng nhập. Bấm "Đăng nhập Google".',1)}});
  if(S.consented)tc.requestAccessToken({prompt:''});
}
$('login').onclick=function(){if(tc)tc.requestAccessToken({prompt:S.consented?'':'consent'});else init()};
$('refresh').onclick=run;
function onToken(r){
  if(r.error){say('Đăng nhập lỗi: '+r.error,1);return}
  tok=r.access_token;S.consented=true;save();
  $('login').hidden=true;$('refresh').hidden=false;
  clearTimeout(timer);
  timer=setTimeout(function(){tc.requestAccessToken({prompt:''})},Math.max(60,(r.expires_in||3600)-120)*1000);
  run();
}
async function api(u){
  var r=await fetch('https://tasks.googleapis.com/tasks/v1/'+u,{headers:{Authorization:'Bearer '+tok}});
  if(r.status===401){tok=null;$('login').hidden=false;$('refresh').hidden=true;throw new Error('Phiên đăng nhập hết hạn')}
  if(!r.ok)throw new Error('Google trả lỗi '+r.status+'. Kiểm tra đã bật Google Tasks API chưa.');
  return r.json();
}
async function fetchAll(){
  var ls=(await api('users/@me/lists?maxResults=100')).items||[],all=[];
  for(var i=0;i<ls.length;i++){
    var pt='';
    do{
      var d=await api('lists/'+ls[i].id+'/tasks?showCompleted=true&showHidden=true&maxResults=100'+(pt?'&pageToken='+pt:''));
      (d.items||[]).forEach(function(t){all.push({id:t.id,list:ls[i].title,title:(t.title||'').trim(),due:t.due,done:t.status==='completed'&&t.completed?Date.parse(t.completed):null})});
      pt=d.nextPageToken;
    }while(pt);
  }
  return all;
}
function key(t){return t.list+'|'+t.title.toLowerCase()}
function build(all){
  var now=Date.now(),cur={},g={};
  all.forEach(function(t){cur[t.id]=1});
  // task chưa xong từng thấy mà nay biến mất = đã bị xóa → mất chuỗi
  Object.keys(S.seen).forEach(function(id){if(!cur[id]){S.broke[S.seen[id]]=sod(now);delete S.seen[id]}});
  all.forEach(function(t){if(t.done)delete S.seen[t.id];else S.seen[t.id]=key(t)});
  all.forEach(function(t){
    if(!t.title||!t.due)return;
    var m=t.due.match(/^(\d+)-(\d+)-(\d+)/);if(!m)return;
    var ds=new Date(+m[1],m[2]-1,+m[3]).getTime(),de=new Date(+m[1],m[2]-1,+m[3]+1).getTime();
    var s=t.done?(t.done<=de?'ok':'late'):(de<=now?'miss':'pend');
    (g[key(t)]=g[key(t)]||{name:t.title,list:t.list,o:[]}).o.push({ds:ds,s:s});
  });
  var res=[],days={};
  Object.keys(g).forEach(function(k){
    var x=g[k];if(x.o.length<3)return;
    var b=S.broke[k]||0,run=0,best=0,o=x.o.filter(function(q){return q.ds>=b}).sort(function(a,c){return a.ds-c.ds});
    o.forEach(function(q){
      if(q.s==='ok'){run++;best=Math.max(best,run)}else if(q.s!=='pend')run=0;
      var d=days[q.ds]||(days[q.ds]={ok:0,bad:0,pend:0});
      if(q.s==='ok')d.ok++;else if(q.s==='pend')d.pend++;else d.bad++;
    });
    res.push({name:x.name,list:x.list,run:run,best:best,dots:o.slice(-14).map(function(q){return q.s}),n:x.o.length,broke:b});
  });
  var dr=0,db=0;
  Object.keys(days).sort(function(a,b){return a-b}).forEach(function(t){var d=days[t];if(d.bad)dr=0;else if(!d.pend&&d.ok){dr++;db=Math.max(db,dr)}});
  save();
  return {res:res.sort(function(a,b){return b.run-a.run}),dr:dr,db:db};
}
var NAMES={ok:'Đúng hạn',late:'Hoàn thành muộn',miss:'Bỏ lỡ',pend:'Chưa tới hạn'};
async function run(){
  if(!tok)return;
  say('Đang đọc Google Tasks…');
  try{
    var r=build(await fetchAll());
    var h='<div class="hero"><b>🔥 '+r.dr+'</b> <span>ngày liên tiếp hoàn thành đúng hạn · tốt nhất '+r.db+' ngày</span></div>';
    if(!r.res.length)h+='<p class="sub">Chưa thấy task lặp lại nào (cùng tên, có ngày hạn, từ 3 lần trở lên).</p>';
    h+=r.res.map(function(x){
      return '<div class="row"><div class="top"><strong>'+esc(x.name)+'</strong><em>🔥 '+x.run+'</em></div>'
      +'<div class="meta">'+esc(x.list)+' · tốt nhất '+x.best+' · '+x.n+' lần'+(x.broke?' · <span class="lost">mất chuỗi do xóa task ngày '+new Date(x.broke).toLocaleDateString('vi-VN')+'</span>':'')+'</div>'
      +'<div class="dots">'+x.dots.map(function(s){return '<i class="dt '+s+'" title="'+NAMES[s]+'"></i>'}).join('')+'</div></div>';
    }).join('');
    $('out').innerHTML=h;
    say('Cập nhật lúc '+new Date().toLocaleTimeString('vi-VN')+'. Giữ tab mở để tự làm mới mỗi 5 phút.');
    clearTimeout(run.t);run.t=setTimeout(run,300000);
  }catch(e){say(e.message,1)}
}
init();
</script>
</body>
</html>
